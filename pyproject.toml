[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scandrop"
version = "0.1.0"
description = "Minimal MCP server for deterministic spatial reasoning over GLB/GLTF scans."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alphashape>=1.3.1",
  "fastapi>=0.115.0",
  "mcp>=1.2.0",
  "numpy>=1.26.0",
  "open3d>=0.18.0",
  "pydantic>=2.8.0",
  "python-multipart>=0.0.9",
  "shapely>=2.0.0",
  "trimesh>=4.4.0",
  "uvicorn>=0.30.0",
]

[project.scripts]
scandrop-mcp = "scandrop.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["scandrop*"]
